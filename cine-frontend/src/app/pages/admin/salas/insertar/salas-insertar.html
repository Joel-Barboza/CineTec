<div class="container-fluid py-4">

  <div class="mb-4">
    <h1 class="h4 fw-semibold mb-0">Salas — Insertar</h1>
    <span class="text-muted small">Registrar nueva sala</span>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h6 class="fw-semibold mb-0">Datos de la sala</h6>
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-12">
              <label class="form-label">ID</label>
              <input class="form-control"
                type="text"
                [value]="id()"
                (input)="id.set($any($event.target).value)"
                placeholder="Ej: SALA-001" />
            </div>

            <div class="col-12">
              <label class="form-label">Nombre de la Sucursal</label>
              <input class="form-control"
                type="text"
                [value]="sucursal()"
                (input)="sucursal.set($any($event.target).value)"
                placeholder="Ej: CineTEC San José" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Cantidad de Filas</label>
              <input class="form-control"
                type="number"
                min="1"
                [value]="filas()"
                (input)="filas.set($any($event.target).value)"
                placeholder="Ej: 10" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Cantidad de Columnas</label>
              <input class="form-control"
                type="number"
                min="1"
                [value]="columnas()"
                (input)="columnas.set($any($event.target).value)"
                placeholder="Ej: 15" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Capacidad</label>
              <input class="form-control"
                type="number"
                min="1"
                [value]="capacidad()"
                (input)="capacidad.set($any($event.target).value)"
                placeholder="Ej: 150" />
            </div>

          </div>

          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-dark" (click)="guardar()">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
