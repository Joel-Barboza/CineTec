<div class="container-fluid py-4">

  <div class="mb-4">
    <h1 class="h4 fw-semibold mb-0">Sucursales — Editar</h1>
    <span class="text-muted small">Editar información de la sucursal</span>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h6 class="fw-semibold mb-0">Datos de la sucursal</h6>
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-12">
              <label class="form-label">Nombre del Cine</label>
              <input class="form-control"
                type="text"
                [value]="nombre()"
                (input)="nombre.set($any($event.target).value)"
                placeholder="Ej: CineTEC San José" />
            </div>

            <div class="col-md-8">
              <label class="form-label">Ubicación</label>
              <input class="form-control"
                type="text"
                [value]="ubicacion()"
                (input)="ubicacion.set($any($event.target).value)"
                placeholder="Ej: Desamparados" />
            </div>

            <div class="col-md-4">
              <label class="form-label">Cantidad de Salas</label>
              <input class="form-control"
                type="number"
                min="1"
                [value]="salas()"
                (input)="salas.set($any($event.target).value)"
                placeholder="Ej: 5" />
            </div>

          </div>

          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-dark" (click)="guardar()">Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
