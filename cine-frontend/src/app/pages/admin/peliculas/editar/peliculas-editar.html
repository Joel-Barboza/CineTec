<div class="container-fluid py-4">

  <div class="mb-4">
    <h1 class="h4 fw-semibold mb-0">Editar Película</h1>
    <span class="text-muted small">Selecciona una película de la lista para editar</span>
  </div>

  <div class="row g-4">

    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h6 class="fw-semibold mb-0">Películas</h6>
        </div>
        <div class="list-group list-group-flush">
          @for (movie of movieList(); track movie.originalName) {
          <button type="button"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            [class.active]="selected()?.originalName === movie.originalName" (click)="select(movie)">
            <div>
              <div class="fw-medium">{{ movie.originalName }}</div>
              <div class="small opacity-75">{{ movie.commercialName }}</div>
            </div>
            <span class="badge text-bg-secondary">{{ movie.rating }}</span>
          </button>
          }
        </div>
      </div>
    </div>

    <div class="col-md-7">
      @if (selected()) {
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom py-3">
          <h6 class="fw-semibold mb-0">Datos de la película</h6>
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Nombre original</label>
              <input class="form-control" [value]="form().originalName"
                (input)="updateField('originalName', $any($event.target).value)" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Nombre comercial</label>
              <input class="form-control" [value]="form().commercialName"
                (input)="updateField('commercialName', $any($event.target).value)" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Director</label>
              <input class="form-control" [value]="form().director"
                (input)="updateField('director', $any($event.target).value)" />
            </div>

            <div class="col-md-3">
              <label class="form-label">Duración (min)</label>
              <input class="form-control" type="number" [value]="form().duration"
                (input)="updateField('duration', +$any($event.target).value)" />
            </div>

            <div class="col-md-3">
              <label class="form-label">Clasificación</label>
              <select class="form-select" [value]="form().rating"
                (change)="updateField('rating', $any($event.target).value)">
                <option value="TP">TP</option>
                <option value="+7">+7</option>
                <option value="+12">+12</option>
                <option value="+15">+15</option>
                <option value="+18">+18</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label">Protagonistas <span class="text-muted fw-normal">(separados por
                  coma)</span></label>
              <input class="form-control" [value]="form().mainActors.join(', ')"
                (input)="updateActors($any($event.target).value)" />
            </div>

            <div class="col-12">
              <label class="form-label">URL de imagen</label>
              <input class="form-control" [value]="form().imageUrl"
                (input)="updateField('imageUrl', $any($event.target).value)" />
            </div>

          </div>

          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-dark" (click)="guardar()">Guardar cambios</button>
            <button class="btn btn-outline-secondary" (click)="selected.set(null)">Cancelar</button>
          </div>

          @if (saved()) {
          <div class="alert alert-success d-flex align-items-center gap-2 mt-3 mb-0 py-2">
            <span>✓</span> Cambios guardados
          </div>
          }

        </div>
      </div>
      } @else {
      <div class="text-center text-muted py-5">
        <p class="mt-2">Selecciona una película de la lista</p>
      </div>
      }
    </div>

  </div>
</div>
